<nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" routerLink="/community" (click)="closeMenu()">Community</a>

    <button class="navbar-toggler" type="button" aria-label="Toggle menu" (click)="toggleMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="menuOpen()">
      @if (auth.isLoggedIn()) {
        <!-- Logged in -->
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/community" routerLinkActive="active" (click)="closeMenu()">Community</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/posts/new" routerLinkActive="active" (click)="closeMenu()">New post</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/profile" routerLinkActive="active" (click)="closeMenu()">Profile</a>
          </li>
          @if (auth.isAdmin()) {
            <li class="nav-item">
              <a class="nav-link" routerLink="/admin" routerLinkActive="active" (click)="closeMenu()">Admin</a>
            </li>
          }
        </ul>
        <span class="navbar-text me-3">
          Signed in as <strong class="text-white">{{ auth.user()?.username }}</strong>
        </span>
        <button class="btn btn-outline-light btn-sm" type="button" (click)="logout()">Log out</button>
      } @else {
        <!-- Guest -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Log in</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register" routerLinkActive="active" (click)="closeMenu()">Register</a>
          </li>
        </ul>
      }
    </div>
  </div>
</nav>

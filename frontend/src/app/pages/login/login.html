<div class="row justify-content-center">
  <div class="col-sm-10 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-4">Log in</h1>

        @if (infoMessage()) {
          <div class="alert alert-info">{{ infoMessage() }}</div>
        }
        @if (error()) {
          <div class="alert alert-danger">{{ error() }}</div>
        }

        <form #loginForm="ngForm" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" class="form-control" autocomplete="username"
                   [(ngModel)]="form.username" required />
          </div>

          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input id="password" name="password" type="password" class="form-control"
                   autocomplete="current-password" [(ngModel)]="form.password" required />
          </div>

          <button class="btn btn-primary w-100" type="submit" [disabled]="loginForm.invalid || busy()">
            {{ busy() ? 'Logging in…' : 'Log in' }}
          </button>
        </form>

        <p class="text-center mt-3 mb-0">
          No account yet? <a routerLink="/register">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
